<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهامي - نظّم يومك</title>
  
</head>
<body>

  <main class="container">

    <header>
      <h1>مهامي</h1>
      <p>نظّم يومك وأنجز أهدافك</p>
    </header>

    <section id="auth-section">
      <h2>حسابك الشخصي</h2>

      <input id="email" type="email"
        placeholder="البريد الإلكتروني">

      <input id="password" type="password"
        placeholder="كلمة المرور">

      <button id="signup-btn">إنشاء حساب</button>
      <button id="login-btn">تسجيل الدخول</button>

      <p id="auth-message"></p>
    </section>

    <section id="tasks-section" hidden>
      <h2>قائمة مهامي</h2>

      <button id="logout-btn">تسجيل الخروج</button>

      <div class="task-input">
        <input id="task-title"
          type="text"
          placeholder="اكتب مهمة جديدة">

        <button id="add-task-btn">إضافة</button>
      </div>

      <div id="tasks-list"></div>
    </section>

  
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
